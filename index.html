<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصور سامي | المتجر الذهبي وعجلة الحظ</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0e17;
            --card-bg: #121824;
            --card-border: #1e293b;
            --gold-gradient: linear-gradient(135deg, #f59e0b, #d97706);
            --gold-light: #fbbf24;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 90px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .btn-top-login {
            background: var(--gold-gradient);
            color: #ffffff;
            font-weight: 800;
            padding: 8px 20px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .brand-text .name-ar {
            font-size: 19px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
        }

        .brand-text .name-en {
            font-size: 11px;
            color: var(--gold-light);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: #1e293b;
            border: 2px solid var(--gold-light);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: var(--gold-light);
            font-size: 18px;
        }

        .profile-header {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--gold-light);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 16px;
            justify-content: space-between;
            align-items: center;
        }

        .profile-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--gold-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 16px;
            color: #000;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px 14px;
            margin-bottom: 16px;
            text-align: center;
            position: relative;
        }

        .invite-box {
            background: linear-gradient(135deg, #162032, #121824);
            border: 1.5px dashed var(--gold-light);
            border-radius: 16px;
            padding: 15px;
            margin-top: 12px;
            text-align: center;
        }

        .btn-invite {
            width: 100%;
            background: var(--gold-gradient);
            color: #000;
            font-weight: 900;
            padding: 12px;
