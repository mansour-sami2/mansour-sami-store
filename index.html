<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر منصور سامي</title>
    <!-- مكتبة التيليجرام الرسمية للـ Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 70px;
        }
        .header {
            width: 92%;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 15px;
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .username-display {
            color: #ffcc00;
            font-size: 14px;
            font-weight: bold;
            direction: ltr;
            text-align: right;
        }
        .stats {
            font-size: 12px;
            color: #aaa;
            margin-top: 3px;
        }
        .avatar {
            background: #ffcc00;
            color: #121212;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
        }
        /* تصميم زر لوحة الأدمن (مخفي افتراضياً ولا يظهر إلا لـ ccc2000) */
        #admin-panel-btn {
            display: none;
            width: 92%;
            background: linear-gradient(45deg, #ffcc00, #e6b800);
            color: #121212;
            border: none;
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 204, 0, 0.2);
            text-align: center;
        }
        .content {
            width: 92%;
            margin-top: 20px;
            text-align: center;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #443311;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 18px;
            color: #ffcc00;
            margin-bottom: 10px;
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            color: #aaa;
            font-size: 11px;
            text-align: center;
            text-decoration: none;
        }
        .nav-item.active {
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي بنسختك الأصلية المضبوطة -->
    <div class="header">
        <div class="avatar" id="user-initial">م</div>
        <div class="user-info">
            <span id="telegram-username" class="username-display">mansour_guest@</span>
            <span class="stats">زوار الموقع الكلي: 1515</span>
        </div>
    </div>

    <!-- زر لوحة تحكم الأدمن (مخفي للجميع ويظهر حصراً لـ ccc2000) -->
    <button id="admin-panel-btn" onclick="openAdminPanel()">
        ⚙️ لوحة تحكم الأدمن (عرض جميع المشتركين والطلبات)
    </button>

    <!-- المحتوى الرئيسي (عجلة الحظ) -->
    <div class="content">
        <div class="card">
            <h2>عجلة الحظ المرتبة الحصرية</h2>
            <p style="font-size: 13px; color: #ccc; margin-bottom: 15px;">تدوير مرة واحدة كل 24 ساعة بدقة!</p>
            
            <div style="background: #221a0a; border: 1px solid #b8860b; border-radius: 10px; padding: 12px; margin-bottom: 15px;">
                <p style="font-size: 12px; color: #ffcc00;">⚠️ شرط أساسي للتدوير:</p>
                <a href="https://t.me/BB4BB2" target="_blank" style="display: block; background: #332200; color: #ffcc00; padding: 8px; border-radius: 8px; margin-top: 8px; text-decoration: none; font-size: 13px;">
                    📢 اشترك في قناة المتجر الرسمية (@BB4BB2)
                </a>
            </div>
            
            <div style="padding: 30px; background: #111; border-radius: 500px; width: 220px; height: 220px; margin: 0 auto; display: flex; align-items: center; justify-content: center; border: 3px solid #ffcc00; color: #ffcc00; font-weight: bold; font-size: 18px;">
                أذر 🎡
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="nav-bar">
        <a href="#" class="nav-item active">🏠<br>الرئيسية</a>
        <a href="#" class="nav-item">🛒<br>متجر الجوائز</a>
        <a href="#" class="nav-item">🎁<br>جوائز</a>
        <a href="#" class="nav-item">🔔<br>الإشعارات</a>
        <a href="#" class="nav-item">👤<br>ملف اللاعب</a>
    </div>

    <!-- كود جافاسكريبت لربط التيليجرام وحماية الأدمن بدقة -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // توسيع الشاشة

        const user = tg.initDataUnsafe?.user;
        const adminUsername = "ccc2000"; // يوزرك الأساسي
        const adminBtn = document.getElementById('admin-panel-btn');

        if (user) {
            const firstName = user.first_name || "مستخدم";
            const username = user.username ? `@${user.username}` : `id: ${user.id}`;
            const cleanUsername = user.username || "";
            
            document.getElementById('telegram-username').innerText = username;
            document.getElementById('user-initial').innerText = firstName.charAt(0);

            // إظهار زر لوحة الأدمن فقط إذا كان الحساب هو ccc2000
            if (cleanUsername === adminUsername) {
                adminBtn.style.display = 'block';
            } else {
                adminBtn.style.display = 'none';
            }
        } else {
            adminBtn.style.display = 'none';
        }

        function openAdminPanel() {
            alert("أهلاً بك يا مدير المتجر الرئيسي! تم فتح لوحة التحكم بنجاح.");
        }
    </script>
</body>
</html>
