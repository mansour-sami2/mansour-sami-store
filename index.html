<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن - متجر منصور سامي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #090d16;
            --card-bg: #111827;
            --card-border: #1f293d;
            --gold: #fbbf24;
            --green: #10b981;
            --text: #ffffff;
            --muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg-main);
            color: var(--text);
            padding: 20px 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* شاشة تسجيل الدخول */
        .login-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            margin-top: 50px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: #1a2333;
            color: #fff;
            text-align: center;
            font-size: 16px;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: var(--gold);
            color: #000;
            font-weight: 900;
            cursor: pointer;
        }

        /* لوحة التحكم الرئيسية */
        .admin-dashboard { display: none; }

        .header-title {
            text-align: center;
            color: var(--gold);
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 16px;
            border-radius: 14px;
            text-align: center;
        }

        .stat-num {
            font-size: 24px;
            font-weight: 900;
            color: var(--gold);
        }

        .stat-label {
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
        }

        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        th, td {
            padding: 10px;
            text-align: right;
            border-bottom: 1px solid var(--card-border);
        }

        th { color: var(--muted); font-weight: 700; }
        td { color: #fff; }

        .badge-ref {
            background: rgba(16, 185, 129, 0.2);
            color: var(--green);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: bold;
        }

        .btn-reset {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- شاشة حماية الأدمن -->
    <div class="login-box" id="loginBox">
        <h2 style="color: var(--gold);">🔐 لوحة الإدارة</h2>
        <p style="color: var(--muted); font-size: 12px; margin-top: 5px;">أدخل كلمة السر للوصول للبيانات</p>
        <input type="password" id="adminPass" placeholder="رمز الدخول">
        <button onclick="checkAdminPassword()">دخول اللوحة</button>
    </div>

    <!-- لوحة التحكم -->
    <div class="admin-dashboard" id="adminDashboard">
        
        <div class="header-title">
            <h2>👑 لوحة تحكم متجر منصور سامي</h2>
            <p style="font-size: 11px; color: var(--muted);">متابعة الزوار والإحالات المباشرة</p>
        </div>

        <!-- إحصائيات عامة -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-num" id="totalVisitors">0</div>
                <div class="stat-label">👥 إجمالي الزوار الحقيقيين</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="totalReferrals">0</div>
                <div class="stat-label">🔗 إجمالي المسجلين بالإحالة</div>
            </div>
        </div>

        <!-- جدول متابعة إحالات الأعضاء -->
        <div class="section-box">
            <div class="section-title">
                <span>📊 إحصائيات إحالات الأعضاء</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>كود العضو</th>
                        <th>عدد المدعوين</th>
                        <th>النقاط المكتسبة</th>
                    </tr>
                </thead>
                <tbody id="referralTableBody">
                    <!-- يتم التعبئة تلقائياً -->
                </tbody>
            </table>
        </div>

        <!-- سجل الدخول الأخير -->
        <div class="section-box">
            <div class="section-title">
                <span>🕒 آخر عمليات الدخول عبر الإحالة</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>الوقت</th>
                        <th>المصدر (كود الدعوة)</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="logsTableBody">
                    <!-- يتم التعبئة تلقائياً -->
                </tbody>
            </table>
        </div>

        <button class="btn-reset" onclick="resetStats()">⚠️ إعادة ضبط جميع الإحصائيات</button>
    </div>

    <script>
        const ADMIN_PASSWORD = "anooalaa"; // كلمة السر الخاصة بك

        function checkAdminPassword() {
            let pass = document.getElementById('adminPass').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                loadAdminData();
            } else {
                alert('كلمة السر خاطئة!');
            }
        }

        function loadAdminData() {
            let visitors = localStorage.getItem('totalVisitorsCount') || '0';
            let refData = JSON.parse(localStorage.getItem('adminReferralData') || '{}');
            let refLogs = JSON.parse(localStorage.getItem('adminReferralLogs') || '[]');

            document.getElementById('totalVisitors').innerText = visitors;

            let totalRef = 0;
            let refTableHTML = '';

            for (let userCode in refData) {
                let count = refData[userCode];
                totalRef += count;
                refTableHTML += `
                    <tr>
                        <td><b>${userCode}</b></td>
                        <td><span class="badge-ref">${count} شخص</span></td>
                        <td>${count * 60} نقطة</td>
                    </tr>
                `;
            }

            document.getElementById('totalReferrals').innerText = totalRef;
            document.getElementById('referralTableBody').innerHTML = refTableHTML || '<tr><td colspan="3" style="text-align:center; color:#9ca3af;">لا توجد إحالات مسجلة حتى الآن</td></tr>';

            let logsHTML = '';
            refLogs.reverse().forEach(log => {
                logsHTML += `
                    <tr>
                        <td>${log.time}</td>
                        <td>${log.refBy}</td>
                        <td style="color: var(--green);">دخول ناجح +60pt</td>
                    </tr>
                `;
            });

            document.getElementById('logsTableBody').innerHTML = logsHTML || '<tr><td colspan="3" style="text-align:center; color:#9ca3af;">لا يوجد سجل دخول حديث</td></tr>';
        }

        function resetStats() {
            if (confirm('هل أنت تأكد من مسح جميع إحصائيات الزوار والإحالات؟')) {
                localStorage.removeItem('totalVisitorsCount');
                localStorage.removeItem('adminReferralData');
                localStorage.removeItem('adminReferralLogs');
                loadAdminData();
                alert('تم تصفير البيانات بنجاح.');
            }
        }
    </script>
</body>
</html>
