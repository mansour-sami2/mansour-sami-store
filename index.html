<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر منصور سامي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #090d16;
            --card-bg: #111827;
            --card-border: #1f293d;
            --gold-gradient: linear-gradient(135deg, #f59e0b, #d97706);
            --gold-light: #fbbf24;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 90px;
        }

        /* شاشة الشعار الافتتاحية */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s ease;
        }

        .splash-logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid var(--gold-light);
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.4);
            animation: pulseLogo 1.5s infinite alternate;
        }

        @keyframes pulseLogo {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.05); }
        }

        .splash-title {
            margin-top: 16px;
            font-size: 20px;
            font-weight: 900;
            color: #fff;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 12px;
        }

        .page-section { display: none; }
        .page-section.active { display: block; }

        .store-header-banner {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 12px;
        }

        .store-logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--gold-light);
        }

        .store-logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 10px 14px;
            margin-bottom: 14px;
        }

        .user-mini-info { display: flex; align-items: center; gap: 10px; }

        .user-avatar-small {
            width: 40px;
            height: 40px;
            background: #4f46e5;
            border: 1.5px solid var(--gold-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #fff;
        }

        .points-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0d121d;
            border: 1px solid var(--gold-light);
            padding: 6px 14px;
            border-radius: 10px;
            font-weight: 900;
            color: var(--gold-light);
        }

        /* عجلة الحظ */
        .wheel-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
        }

        .wheel-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 15px auto;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--gold-light);
            background: conic-gradient(
                #f59e0b 0deg 60deg, 
                #111827 60deg 120deg, 
                #3b82f6 120deg 180deg, 
                #10b981 180deg 240deg, 
                #ef4444 240deg 300deg, 
                #8b5cf6 300deg 360deg
            );
            transition: transform 3s cubic-bezier(0.15, 0.85, 0.35, 1.2);
        }

        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 18px solid #fff;
            z-index: 10;
        }

        .btn-spin {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 10px;
        }

        /* شبكة المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img-box {
            width: 100%;
            height: 120px;
            background: #1e293b;
        }

        .product-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .product-details { padding: 10px; }
        .product-title { font-size: 14px; font-weight: 900; }
        .product-meta { display: flex; justify-content: space-between; font-size: 11px; margin: 6px 0; }
        .btn-buy { width: 100%; background: var(--gold-gradient); border: none; padding: 8px; border-radius: 8px; font-weight: 900; cursor: pointer; }

        /* شريط التنقل */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #0b0f19;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            max-width: 480px;
            margin: 0 auto;
        }

        .nav-item {
            background: none; border: none; color: var(--text-muted);
            font-size: 11px; font-weight: 700; cursor: pointer;
            display: flex; flex-direction: column; align-items: center;
        }
        .nav-item.active { color: var(--gold-light); }
    </style>
</head>
<body>

    <!-- شاشة الشعار عند الفتح -->
    <div id="splash-screen">
        <img src="1000121424.jpg" alt="منصور سامي" class="splash-logo" onerror="this.src='https://via.placeholder.com/130'">
        <div class="splash-title">متجر منصور سامي</div>
    </div>

    <div class="app-container">
        <div class="store-header-banner">
            <div class="store-logo-icon">
                <img src="1000121424.jpg" alt="شعار">
            </div>
            <div>
                <div style="font-size: 14px; font-weight: 900;">متجر منصور سامي</div>
                <div style="font-size: 10px; color: var(--gold-light);">القسم الرسمي لبيع الحسابات 🔥</div>
            </div>
        </div>

        <div class="top-bar">
            <div class="user-mini-info">
                <div class="user-avatar-small" id="userAvatarText">A</div>
                <div>
                    <div style="font-size: 13px; font-weight: 900;" id="displayUserName">Anoo Tektok</div>
                    <div style="font-size: 10px; color: var(--text-muted);" id="userEmailText">anootektok@gmail.com</div>
                </div>
            </div>
            <div class="points-badge">
                <span id="userPointsHeader">250</span> نقطة
            </div>
        </div>

        <!-- الرئيسية وعجلة الحظ -->
        <div id="page-home" class="page-section active">
            <div class="wheel-box">
                <h3>🎡 عجلة الحظ اليومية</h3>
                <div class="wheel-container">
                    <div class="wheel-pointer"></div>
                    <div class="wheel" id="wheel"></div>
                </div>
                <button class="btn-spin" onclick="spinWheel()">أدر العجلة الآن ✨</button>
            </div>
        </div>

        <!-- المتجر -->
        <div id="page-store" class="page-section">
            <div class="products-grid" id="productsContainer"></div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchPage('home', this)"><span>🏠</span><span>الرئيسية</span></button>
        <button class="nav-item" onclick="switchPage('store', this)"><span>🛒</span><span>المتجر</span></button>
    </nav>

    <script>
        let currentPoints = 250;
        let isSpinning = false;

        // إخفاء الشاشة الافتتاحية بعد تحميل الموقع
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, 2000);
        });

        // توليد الأصوات برمجياً بدون ملفات خارجية
        function playSpinSound() {
            let ctx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 3);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 3);
        }

        function playWinSound() {
            let ctx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.15);
            osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.6);
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            playSpinSound();

            let randomDegree = Math.floor(1800 + Math.random() * 360);
            let wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${randomDegree}deg)`;

            setTimeout(() => {
                playWinSound();
                let earned = 250;
                currentPoints += earned;
                document.getElementById('userPointsHeader').innerText = currentPoints;
                alert(`مبروك! حصلت على ${earned} نقطة 🎉`);
                isSpinning = false;
            }, 3000);
        }

        function switchPage(pageId, btn) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
