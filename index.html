<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر منصور سامي | CHALZ</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #6c5ce7;
            --secondary: #00b894;
            --accent: #fdcb6e;
            --text-main: #2d3436;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .header {
            background: linear-gradient(135deg, #4a00e0, #8e2de2);
            color: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(110, 0, 224, 0.3);
            margin-bottom: 20px;
        }
        .header h1 { margin: 0; font-size: 24px; font-weight: 800; }
        .header p { margin: 5px 0 0 0; opacity: 0.9; font-size: 14px; }
        
        .wheel-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        .wheel-container {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 0 auto 15px auto;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #e0e0e0;
            box-sizing: border-box;
            background: conic-gradient(
                #ff7675 0 45deg,
                #74b9ff 45deg 90deg,
                #55efc4 90deg 135deg,
                #ffeaa7 135deg 180deg,
                #a29bfe 180deg 225deg,
                #fd79a8 225deg 270deg,
                #00b894 270deg 315deg,
                #e17055 315deg 360deg
            );
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .spin-btn {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 184, 148, 0.4);
            width: 100%;
            max-width: 250px;
        }

        .section-title {
            text-align: right;
            font-size: 18px;
            margin: 20px 0 10px 0;
            color: #2d3436;
        }
        .rewards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .reward-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            border: 2px solid #a29bfe;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            text-align: center;
        }
        .reward-card h4 { margin: 0 0 5px 0; color: #4a00e0; font-size: 15px; }
        .reward-card p { margin: 0; color: #00b894; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>متجر منصور سامي</h1>
        <p>أدر عجلة الحظ واجمع النقاط للجوائز!</p>
    </div>

    <div class="wheel-box">
        <div class="wheel-container">
            <div class="wheel" id="wheel"></div>
        </div>
        <button class="spin-btn" onclick="spin()">لف العجلة مجاناً 🎡</button>
    </div>

    <div class="section-title">قسم الجوائز المتاحة 🎁</div>
    <div class="rewards-grid">
        <div class="reward-card">
            <h4>بطاقة تغيير الاسم</h4>
            <p>1500 نقطة</p>
        </div>
        <div class="reward-card">
            <h4>60 شدة ببجي</h4>
            <p>3000 نقطة</p>
        </div>
        <div class="reward-card">
            <h4>رويال باس</h4>
            <p>7500 نقطة</p>
        </div>
        <div class="reward-card">
            <h4>حساب تيك توك</h4>
            <p>10000 نقطة</p>
        </div>
    </div>

    <script>
        let currentRotation = 0;
        function spin() {
            currentRotation += 1440 + Math.floor(Math.random() * 360);
            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;
        }
    </script>
</body>
</html>
