<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر وعجلة الحظ الرقمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d0f17;
            --card-bg: #161b26;
            --accent-purple: #7c3aed;
            --accent-cyan: #06b6d4;
            --accent-pink: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #2e374a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-nav {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(22, 27, 38, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-btn {
            background: var(--border-color);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            background: var(--accent-purple);
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .section-title {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Wheel Styles */
        .wheel-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .wheel-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px 0;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid var(--accent-pink);
            z-index: 10;
            filter: drop-shadow(0 0 8px var(--accent-pink));
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
            border: 4px solid var(--border-color);
        }

        .spin-btn {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(236, 72, 153, 0.4);
            transition: transform 0.2s;
        }

        .spin-btn:active {
            transform: scale(0.95);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .product-card {
            background: #1e2433;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-cyan);
        }

        .product-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            background: var(--bg-dark);
        }

        .product-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 18px;
            color: var(--accent-cyan);
            font-weight: 900;
            margin-bottom: 12px;
        }

        .buy-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Modal / Popups */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px; left: 15px;
            background: none; border: none;
            color: var(--text-muted);
            font-size: 20px; cursor: pointer;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #1e2433;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 10px;
            outline: none;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: var(--accent-purple);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .item-list {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e2433;
            padding: 10px 15px;
            border-radius: 10px;
        }

        .btn-del {
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header-nav">
        <div class="logo">🎮 المتجر الذهبي وعجلة الحظ</div>
        <button class="admin-btn" onclick="openAdmin()">⚙️ الأدمن</button>
    </div>

    <div class="main-container">
        <!-- قسم عجلة الحظ -->
        <div class="card wheel-box">
            <h2 class="section-title">🎡 ادر العجلة واكسب جائزتك</h2>
            <div class="wheel-wrapper">
                <div class="pointer"></div>
                <canvas id="wheel" width="300" height="300"></canvas>
            </div>
            <button class="spin-btn" id="spinBtn" onclick="spinWheel()">تدوير العجلة 🚀</button>
        </div>

        <!-- قسم المتجر -->
        <div class="card">
            <h2 class="section-title">🛍️ الحسابات والخدمات المتاحة</h2>
            <div class="products-grid" id="productsGrid"></div>
        </div>
    </div>

    <!-- نافذة النتيجة -->
    <div class="modal" id="resultModal">
        <div class="modal-content" style="text-align: center;">
            <h2 style="color: var(--accent-cyan); margin-bottom: 10px;">🎉 مبروك!</h2>
            <p id="resultText" style="font-size: 18px; margin-bottom: 20px;"></p>
            <button class="btn-action" onclick="closeModal()">تم</button>
        </div>
    </div>

    <!-- نافذة الأدمن -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeAdmin()">✕</button>
            <h3 style="margin-bottom: 20px; text-align: center;">⚙️ لوحة تحكم الأدمن</h3>
            
            <h4 style="color: var(--accent-pink); margin-bottom: 10px;">🎡 جوائز العجلة:</h4>
            <div class="input-group">
                <input type="text" id="prizeInput" placeholder="اسم الجائزة الجديد">
            </div>
            <button class="btn-action" style="background: var(--accent-pink);" onclick="addPrize()">إضافة للجلة</button>
            <div class="item-list" id="prizesAdminList"></div>

            <hr style="border-color: var(--border-color); margin: 25px 0;">

            <h4 style="color: var(--accent-cyan); margin-bottom: 10px;">🛍️ التحكم بالمتجر:</h4>
            <div class="input-group">
                <input type="text" id="prodName" placeholder="اسم المنتج/الحساب">
            </div>
            <div class="input-group">
                <input type="text" id="prodPrice" placeholder="السعر (مثلاً 20$)">
            </div>
            <div class="input-group">
                <input type="text" id="prodImg" placeholder="رابط الصورة (اختياري)">
            </div>
            <button class="btn-action" style="background: var(--accent-cyan);" onclick="addProduct()">إضافة للمتجر</button>
            <div class="item-list" id="prodsAdminList"></div>
        </div>
    </div>

    <script>
        // البيانات الأولية
        let prizes = JSON.parse(localStorage.getItem('wheel_prizes')) || [
            "شدات ببجي 60", "رشق انستا 1k", "حساب تيك توك", "حظ أوفر 💔", "خصم 50%", "شحن شدات 120"
        ];

        let products = JSON.parse(localStorage.getItem('store_products')) || [
            { id: 1, name: "حساب ببجي مميز", price: "35$", img: "https://via.placeholder.com/80/161b26/ffffff?text=PUBG" },
            { id: 2, name: "حساب تليجرام ثلاثي", price: "20$", img: "https://via.placeholder.com/80/161b26/ffffff?text=TG" }
        ];

        const colors = ['#7c3aed', '#06b6d4', '#ec4899', '#8b5cf6', '#3b82f6', '#f43f5e'];

        // رسم العجلة
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        let isSpinning = false;
        let currentAngle = 0;

        function drawWheel() {
            const numOptions = prizes.length;
            if (numOptions === 0) return;
            const arcSize = (2 * Math.PI) / numOptions;

            ctx.clearRect(0, 0, 300, 300);

            for (let i = 0; i < numOptions; i++) {
                const angle = i * arcSize + currentAngle;
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 140, angle, angle + arcSize);
                ctx.lineTo(150, 150);
                ctx.fill();

                // النص
                ctx.save();
                ctx.fillStyle = '#ffffff';
                ctx.translate(150, 150);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.font = "bold 13px Tajawal";
                ctx.fillText(prizes[i], 120, 5);
                ctx.restore();
            }
        }

        function spinWheel() {
            if (isSpinning || prizes.length === 0) return;
            isSpinning = true;

            const extraRotations = 5 + Math.floor(Math.random() * 5);
            const randomSector = Math.floor(Math.random() * prizes.length);
            const arcSize = (2 * Math.PI) / prizes.length;
            const targetAngle = extraRotations * 2 * Math.PI + (prizes.length - randomSector - 0.5) * arcSize;

            let start = null;
            function animate(timestamp) {
                if (!start) start = timestamp;
                let progress = (timestamp - start) / 4000;

                if (progress < 1) {
                    let easeOut = 1 - Math.pow(1 - progress, 3);
                    currentAngle = easeOut * targetAngle;
                    drawWheel();
                    requestAnimationFrame(animate);
                } else {
                    currentAngle = targetAngle % (2 * Math.PI);
                    drawWheel();
                    isSpinning = false;
                    showResult(prizes[randomSector]);
                }
            }
            requestAnimationFrame(animate);
        }

        function showResult(prize) {
            document.getElementById('resultText').innerText = `حصلت على: ${prize}`;
            document.getElementById('resultModal').style.display = 'flex';
        }

        // عرض المنتجات
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img}" class="product-img" alt="${p.name}">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${p.price}</div>
                        <button class="buy-btn" onclick="alert('تواصل مع الأدمن للشراء!')">شراء الآن 💳</button>
                    </div>
                `;
            });
        }

        // لوحة الأدمن
        function openAdmin() {
            let p = prompt("كلمة سر الأدمن:");
            if (p === "1234") {
                renderPrizesAdmin();
                renderProductsAdmin();
                document.getElementById('adminModal').style.display = 'flex';
            } else if (p !== null) {
                alert("كلمة المرور خاطئة!");
            }
        }

        function closeAdmin() { document.getElementById('adminModal').style.display = 'none'; }
        function closeModal() { document.getElementById('resultModal').style.display = 'none'; }

        function renderPrizesAdmin() {
            const list = document.getElementById('prizesAdminList');
            list.innerHTML = '';
            prizes.forEach((p, idx) => {
                list.innerHTML += `
                    <div class="item-row">
                        <span>🎁 ${p}</span>
                        <button class="btn-del" onclick="deletePrize(${idx})">حذف</button>
                    </div>
                `;
            });
        }

        function addPrize() {
            let val = document.getElementById('prizeInput').value;
            if (val) {
                prizes.push(val);
                localStorage.setItem('wheel_prizes', JSON.stringify(prizes));
                document.getElementById('prizeInput').value = '';
                renderPrizesAdmin();
                drawWheel();
            }
        }

        function deletePrize(idx) {
            prizes.splice(idx, 1);
            localStorage.setItem('wheel_prizes', JSON.stringify(prizes));
            renderPrizesAdmin();
            drawWheel();
        }

        function renderProductsAdmin() {
            const list = document.getElementById('prodsAdminList');
            list.innerHTML = '';
            products.forEach((p, idx) => {
                list.innerHTML += `
                    <div class="item-row">
                        <span>🛍️ ${p.name} (${p.price})</span>
                        <button class="btn-del" onclick="deleteProduct(${idx})">حذف</button>
                    </div>
                `;
            });
        }

        function addProduct() {
            let name = document.getElementById('prodName').value;
            let price = document.getElementById('prodPrice').value;
            let img = document.getElementById('prodImg').value || 'https://via.placeholder.com/80/161b26/ffffff?text=Item';
            if (name && price) {
                products.push({ id: Date.now(), name, price, img });
                localStorage.setItem('store_products', JSON.stringify(products));
                document.getElementById('prodName').value = '';
                document.getElementById('prodPrice').value = '';
                document.getElementById('prodImg').value = '';
                renderProductsAdmin();
                renderProducts();
            }
        }

        function deleteProduct(idx) {
            products.splice(idx, 1);
            localStorage.setItem('store_products', JSON.stringify(products));
            renderProductsAdmin();
            renderProducts();
        }

        // بدء التشغيل
        drawWheel();
        renderProducts();
    </script>
</body>
</html>
