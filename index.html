<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر منصور سامي</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #f59e0b;
      --text-color: #f8fafc;
      --text-secondary: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 70px; }
    
    header {
      background-color: var(--card-bg);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); display: flex; align-items: center; gap: 8px; }
    .points-badge { background: rgba(245, 158, 11, 0.1); color: var(--accent-color); border: 1px solid var(--accent-color); padding: 5px 12px; border-radius: 20px; font-weight: bold; }

    .container { padding: 15px; max-width: 600px; margin: 0 auto; }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #334155;
    }
    
    .btn {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    .btn-google { background-color: #fff; color: #333; }

    .wheel-box { text-align: center; }
    .wheel-icon { font-size: 3rem; color: var(--accent-color); margin: 10px 0; animation: spin 10s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .grid-menu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
    .grid-item { background: var(--card-bg); border: 1px solid #334155; border-radius: 10px; padding: 15px 5px; text-align: center; font-size: 0.85rem; }
    .grid-item i { font-size: 1.5rem; color: var(--accent-color); display: block; margin-bottom: 8px; }

    nav {
      position: fixed; bottom: 0; width: 100%;
      background: var(--card-bg);
      display: flex; justify-content: space-around;
      padding: 10px 0; border-top: 1px solid #334155;
    }
    nav a { color: var(--text-secondary); text-decoration: none; font-size: 0.75rem; text-align: center; }
    nav a.active { color: var(--accent-color); }
    nav a i { font-size: 1.2rem; display: block; margin-bottom: 3px; }
  </style>
</head>
<body>

  <header>
    <div class="logo"><i class="fas fa-shield-alt"></i> متجر منصور سامي</div>
    <div class="points-badge" id="user-points">0 نقطة</div>
  </header>

  <div class="container">
    <!-- كارت تسجيل الدخول -->
    <div class="card" id="auth-card">
      <h3 id="auth-title">أنت تتصفح كضيف</h3>
      <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px;">
        سجّل الدخول بحساب رسمي كي تلف عجلة الحظ، تجمع النقاط، وتشتري الجوائز.
      </p>
      <button class="btn btn-google" id="login-btn">
        <i class="fab fa-google" style="color: #ea4335;"></i> تسجيل الدخول بواسطة Google
      </button>
      <button class="btn" id="logout-btn" style="display:none; background: #ef4444; color: white;">
        تسجيل الخروج
      </button>
    </div>

    <!-- كارت عجلة الحظ -->
    <div class="card wheel-box">
      <h3>عجلة الحظ</h3>
      <p style="color: var(--text-secondary); font-size: 0.85rem;">دوران مجاني كل 24 ساعة</p>
      <i class="fas fa-sync-alt wheel-icon"></i>
      <button class="btn" id="spin-btn">تدوير العجلة (احصل على نقاط)</button>
    </div>

    <!-- شبكة الخدمات -->
    <div class="grid-menu">
      <div class="grid-item">
        <i class="fas fa-shopping-cart"></i>
        متجر الجوائز
      </div>
      <div class="grid-item">
        <i class="fas fa-box"></i>
        جوائزي
      </div>
      <div class="grid-item">
        <i class="fas fa-users"></i>
        ادعُ أصدقاءك
      </div>
    </div>
  </div>

  <nav>
    <a href="#" class="active"><i class="fas fa-home"></i>الرئيسية</a>
    <a href="#"><i class="fas fa-shopping-cart"></i>المتجر</a>
    <a href="#"><i class="fas fa-box"></i>جوائزي</a>
    <a href="#"><i class="fas fa-bell"></i>الإشعارات</a>
    <a href="#"><i class="fas fa-user"></i>الملف الشخصي</a>
  </nav>

  <!-- ربط خدمات Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // مفاتيح مشروعك الخاصة
    const firebaseConfig = {
      apiKey: "AIzaSyCZt0KmOitwJdkQqBm9uQOQtoDzVP0BSS0",
      authDomain: "mansour-store-5c26c.firebaseapp.com",
      projectId: "mansour-store-5c26c",
      storageBucket: "mansour-store-5c26c.firebasestorage.app",
      messagingSenderId: "44186166218",
      appId: "1:44186166218:web:c172db1aadfde960bfa533"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;

    // عناصر الواجهة
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const authTitle = document.getElementById('auth-title');
    const userPointsEl = document.getElementById('user-points');
    const spinBtn = document.getElementById('spin-btn');

    // متابعة حالة تسجيل الدخول
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        authTitle.innerText = `أهلاً بك، ${user.displayName}`;
        loginBtn.style.display = 'none';
        logoutBtn.style.display = 'flex';

        // جلب أو إنشاء حساب المستند في قاعدة البيانات
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
          await setDoc(userRef, { name: user.displayName, email: user.email, points: 0 });
          userPointsEl.innerText = "0 نقطة";
        } else {
          userPointsEl.innerText = `${userSnap.data().points || 0} نقطة`;
        }
      } else {
        currentUser = null;
        authTitle.innerText = "أنت تتصفح كضيف";
        loginBtn.style.display = 'flex';
        logoutBtn.style.display = 'none';
        userPointsEl.innerText = "0 نقطة";
      }
    });

    // زر تسجيل الدخول
    loginBtn.addEventListener('click', () => {
      signInWithPopup(auth, provider).catch(error => {
        alert("حدث خطأ بتسجيل الدخول: " + error.message);
      });
    });

    // زر تسجيل الخروج
    logoutBtn.addEventListener('click', () => signOut(auth));

    // زر العجلة (إضافة نقاط حقيقية)
    spinBtn.addEventListener('click', async () => {
      if (!currentUser) {
        alert("يرجى تسجيل الدخول أولاً لتلف عجلة الحظ!");
        return;
      }

      const randomPoints = Math.floor(Math.random() * 50) + 10;
      const userRef = doc(db, "users", currentUser.uid);

      await updateDoc(userRef, { points: increment(randomPoints) });
      
      const updatedSnap = await getDoc(userRef);
      userPointsEl.innerText = `${updatedSnap.data().points} نقطة`;
      alert(`مبروك! حصلت على ${randomPoints} نقطة!`);
    });
  </script>
</body>
</html>
