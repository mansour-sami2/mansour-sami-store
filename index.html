<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>عجلة المكافآت</title>

<style>
:root{
  --bg:#f5f3ed;
  --card:#fff;
  --text:#18202b;
  --muted:#687386;
  --accent:#0f8b8d;
  --accent2:#075e60;
  --gold:#d69b24;
  --border:#e1e3e7;
  --danger:#b42318
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:var(--bg);
  color:var(--text)
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:18px
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:16px
}

h1{
  margin:0;
  font-size:24px
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-top:5px
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  margin-bottom:15px
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff
}

.field{
  flex:1;
  min-width:170px
}

button{
  border:0;
  border-radius:11px;
  padding:11px 15px;
  cursor:pointer;
  background:var(--accent);
  color:#fff;
  font-weight:800
}

button.secondary{
  background:#e8eef0;
  color:var(--accent2)
}

button.danger{
  background:#fff0ef;
  color:var(--danger)
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

.userbar{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  flex-wrap:wrap
}

.wheelbox{
  display:grid;
  grid-template-columns:minmax(280px,360px) 1fr;
  gap:24px;
  align-items:center
}

canvas{
  width:100%;
  max-width:340px;
  aspect-ratio:1;
  border-radius:50%;
  display:block;
  margin:auto
}

.pointer{
  width:0;
  height:0;
  border-left:13px solid transparent;
  border-right:13px solid transparent;
  border-top:28px solid var(--gold);
  margin:0 auto -8px;
  position:relative;
  z-index:2
}

.center{
  text-align:center
}

.timer{
  font-weight:800;
  color:var(--accent2);
  margin:12px 0
}

.note{
  font-size:12px;
  color:var(--muted);
  line-height:1.7
}

.prizes{
  display:grid;
  grid-template-columns:repeat(
    auto-fit,
    minmax(170px,1fr)
  );
  gap:9px
}

.prize{
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  background:#fcfcfb
}

.prize b{
  display:block;
  margin-bottom:5px
}

.prob{
  font-size:11px;
  color:var(--muted)
}

.hidden{
  display:none!important
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:20
}

.modal.show{
  display:flex
}

.modal-card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  max-width:480px;
  width:100%
}

.admin{
  border:2px solid #b9dfe0
}

.stat{
  background:#f8fafb;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  min-width:130px
}

.stat strong{
  display:block;
  font-size:20px
}

.stat span{
  font-size:11px;
  color:var(--muted)
}

.list{
  display:grid;
  gap:8px
}

.item{
  padding:10px;
  border:1px solid var(--border);
  border-radius:10px
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px
}

th,td{
  padding:9px;
  border-bottom:1px solid var(--border);
  text-align:right
}

@media(max-width:700px){
  .wheelbox{
    grid-template-columns:1fr
  }

  .wrap{
    padding:12px
  }

  header{
    align-items:flex-start;
    flex-direction:column
  }
}
</style>
</head>

<body>

<div class="wrap">

<header>

  <div>
    <h1>🎡 عجلة المكافآت</h1>

    <div class="sub">
      مشاركة واحدة لكل حساب كل 24 ساعة
    </div>
  </div>

  <button
    id="adminBtn"
    class="secondary">

    ⚙️ الأدمن

  </button>

</header>

<section class="card">

  <div class="userbar">

    <div>

      <b id="userLabel">
        زائر
      </b>

      <div
        class="sub"
        id="pointsLabel">

        الرصيد: 0 نقطة

      </div>

    </div>

    <div class="row">

      <button id="loginBtn">
        تسجيل الحساب
      </button>

      <button
        id="logoutBtn"
        class="secondary hidden">

        تسجيل خروج

      </button>

    </div>

  </div>

</section>

<section class="card">

  <div class="wheelbox">

    <div>

      <div class="pointer"></div>

      <canvas
        id="wheel"
        width="340"
        height="340">
      </canvas>

      <div class="center">

        <button
          id="spinBtn"
          disabled>

          🎯 لف العجلة

        </button>

        <div
          id="timer"
          class="timer">

          سجّل الدخول للمشاركة

        </div>

      </div>

    </div>

    <div>

      <h2>
        المكافآت
      </h2>

      <div
        id="prizes"
        class="prizes">
      </div>

      <p class="note">
        الاحتمالات ظاهرة للمستخدم
        ومجموعها 100%.
      </p>

    </div>

  </div>

</section>

<section class="card">

  <h2>
    👥 رابط الإحالة
  </h2>

  <div class="row">

    <div class="field">

      <input
        id="refLink"
        readonly
        placeholder="سجّل الدخول أولاً">

    </div>

    <button id="copyRef">
      نسخ الرابط
    </button>

  </div>

  <div
    class="row"
    style="margin-top:10px">

    <div class="stat">

      <strong id="refVisits">
        0
      </strong>

      <span>
        زيارات الإحالة
      </span>

    </div>

    <div class="stat">

      <strong id="refUsers">
        0
      </strong>

      <span>
        المسجلون من رابطك
      </span>

    </div>

  </div>

</section>
``
