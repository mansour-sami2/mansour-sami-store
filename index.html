<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | الصفحة غير موجودة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0e17;
            --card-bg: #111827;
            --card-border: #1f293d;
            --gold-gradient: linear-gradient(135deg, #f59e0b, #d97706);
            --gold-light: #fbbf24;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .error-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
            opacity: 0.6;
        }

        .error-code {
            font-size: 80px;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        .error-emoji {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .error-title {
            font-size: 20px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 8px;
        }

        .error-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn-home {
            display: inline-block;
            width: 100%;
            background: var(--gold-gradient);
            color: #111;
            font-weight: 900;
            padding: 13px;
            border-radius: 14px;
            border: none;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.25);
            transition: 0.2s;
        }

        .btn-home:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-emoji">🛸</div>
        <div class="error-code">404</div>
        <h1 class="error-title">الصفحة غير موجودة!</h1>
        <p class="error-desc">عذراً عزيزي، يبدو أنك وصلت إلى رابط خاطئ أو أن الصفحة قد تم نقلها أو حذفها.</p>
        <a href="/" class="btn-home">العودة إلى الصفحة الرئيسية 🏠</a>
    </div>

</body>
</html>
