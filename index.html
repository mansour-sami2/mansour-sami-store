<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر منصور سامي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #090d16;
            --card-bg: #111827;
            --card-border: #1f293d;
            --gold-gradient: linear-gradient(135deg, #f59e0b, #d97706);
            --gold-light: #fbbf24;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 90px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 12px;
        }

        .top-brand-header {
            text-align: center;
            padding: 10px 0 15px 0;
        }

        .top-brand-title {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
        }

        .top-brand-sub {
            font-size: 11px;
            color: var(--gold-light);
            margin-top: 2px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 10px 14px;
            margin-bottom: 14px;
        }

        .user-mini-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar-small {
            width: 40px;
            height: 40px;
            background: #4f46e5;
            border: 1.5px solid var(--gold-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #fff;
            font-size: 18px;
        }

        .points-badge {
            background: #0d121d;
            border: 1px solid var(--gold-light);
            padding: 6px 14px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 15px;
            color: var(--gold-light);
        }

        /* كرت عداد الزوار الحقيقيين ونظام الإحالة */
        .stats-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 900;
            color: var(--gold-light);
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .btn-ref-link {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--gold-light);
            color: var(--gold-light);
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 14px;
        }

        /* عجلة الحظ */
        .wheel-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
        }

        .wheel-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 15px auto;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--gold-light);
            background: conic-gradient(
                #f59e0b 0deg 60deg, 
                #111827 60deg 120deg, 
                #3b82f6 120deg 180deg, 
                #10b981 180deg 240deg, 
                #ef4444 240deg 300deg, 
                #8b5cf6 300deg 360deg
            );
            transition: transform 3s cubic-bezier(0.15, 0.85, 0.35, 1.2);
        }

        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 18px solid #fff;
            z-index: 10;
        }

        .btn-spin {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        .btn-spin:disabled {
            background: #1f293d;
            color: #6b7280;
            cursor: not-allowed;
        }

        /* كروت المتجر */
        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img-box {
            width: 100%;
            height: 120px;
            background: #1e293b;
            position: relative;
        }

        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-tag {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #cbd5e1;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .product-tag.rare {
            background: rgba(30, 58, 138, 0.8);
            border-color: #3b82f6;
            color: #93c5fd;
        }

        .product-details {
            padding: 10px;
            text-align: right;
        }

        .product-title {
            font-size: 14px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 2px;
        }

        .product-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            margin-bottom: 8px;
        }

        .product-points { color: var(--gold-light); font-weight: 900; }
        .product-stock { color: var(--text-muted); }

        .btn-buy {
            width: 100%;
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-buy.out-of-stock {
            background: #1f293d;
            color: #6b7280;
            cursor: not-allowed;
        }

        .page-section { display: none; }
        .page-section.active { display: block; }

        /* شريط التنقل */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #0b0f19;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 10px 0;
            max-width: 480px;
            margin: 0 auto;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            background: none;
            border: none;
        }

        .nav-item.active { color: var(--gold-light); }
        .nav-item .nav-icon { font-size: 20px; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="top-brand-header">
            <div class="top-brand-title">متجر منصور سامي</div>
            <div class="top-brand-sub">القسم الرسمي لبيع الحسابات والخدمات 🔥</div>
        </div>

        <div class="top-bar">
            <div class="user-mini-info">
                <div class="user-avatar-small">A</div>
                <div>
                    <div style="font-size: 13px; font-weight: 900;">Anoo Tektok</div>
                    <div style="font-size: 10px; color: var(--text-muted);">anootektok@gmail.com</div>
                </div>
            </div>
            <div class="points-badge">
                <span id="userPointsHeader">250</span> نقطة
            </div>
        </div>

        <!-- عداد الزوار الحقيقيين والإحالات -->
        <div class="stats-card">
            <div class="stat-item">
                <div class="stat-value" id="realVisitorsCount">1</div>
                <div class="stat-label">👥 زوار الموقع الحقيقيين</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="referralCount">0</div>
                <div class="stat-label">🔗 الأعضاء المسجلين عن طريقك</div>
            </div>
        </div>

        <button class="btn-ref-link" onclick="copyReferralLink()">📋 نسخ رابط الإحالة الخاص بك (احصل على 60 نقطة لكل شخص)</button>

        <!-- الصفحة الرئيسية وعجلة الحظ -->
        <div id="page-home" class="page-section active">
            <div class="wheel-box">
                <h3>🎡 عجلة الحظ اليومية</h3>
                <div class="wheel-container">
                    <div class="wheel-pointer"></div>
                    <div class="wheel" id="wheel"></div>
                </div>
                <button class="btn-spin" id="spinBtn" onclick="spinWheel()">أدر العجلة الآن ✨</button>
            </div>
        </div>

        <!-- متجر الجوائز -->
        <div id="page-store" class="page-section">
            <div class="products-grid" id="productsContainer"></div>
        </div>

        <!-- جوائزي -->
        <div id="page-prizes" class="page-section">
            <div style="font-size:16px; font-weight:900; margin-bottom:10px;">🏆 جوائزي التي حصلت عليها</div>
            <p style="color: var(--text-muted); font-size: 12px; text-align: center; margin-top: 20px;">لا توجد جوائز حالياً</p>
        </div>

        <!-- الإشعارات -->
        <div id="page-notifications" class="page-section">
            <div style="font-size:16px; font-weight:900; margin-bottom:10px;">🔔 الإشعارات والطلبات</div>
            <p style="color: var(--text-muted); font-size: 12px; text-align: center; margin-top: 20px;">لا توجد إشعارات جديدة</p>
        </div>

        <!-- ملف اللاعب -->
        <div id="page-profile" class="page-section">
            <div style="text-align: center; padding: 20px; background: var(--card-bg); border-radius: 16px;">
                <h2 style="color:#fff;">Anoo Tektok</h2>
                <p style="color:var(--gold-light); margin-top:5px; font-weight:bold;">النقاط: <span id="profilePoints">250</span></p>
            </div>
        </div>

    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchPage('home', this)">
            <span class="nav-icon">🏠</span>
            <span>الرئيسية</span>
        </button>
        <button class="nav-item" onclick="switchPage('store', this)">
            <span class="nav-icon">🛒</span>
            <span>متجر الجوائز</span>
        </button>
        <button class="nav-item" onclick="switchPage('prizes', this)">
            <span class="nav-icon">📦</span>
            <span>جوائزي</span>
        </button>
        <button class="nav-item" onclick="switchPage('notifications', this)">
            <span class="nav-icon">🔔</span>
            <span>الإشعارات</span>
        </button>
        <button class="nav-item" onclick="switchPage('profile', this)">
            <span class="nav-icon">👤</span>
            <span>ملف اللاعب</span>
        </button>
    </nav>

    <script>
        let currentPoints = parseInt(localStorage.getItem('userPoints') || '250');
        let isSpinning = false;

        let products = [
            { id: 1, name: "رشق تيك توك", price: 3000, stock: 0, tag: "عادية", isRare: false, img: "1000121462.jpg", desc: "رشق حسابك التيك توك 1k متابع" },
            { id: 2, name: "رشق حسابك الانستا", price: 3000, stock: 59, tag: "عادية", isRare: false, img: "1000121462.jpg", desc: "رشق حسابك الانستا 1k متابع" },
            { id: 3, name: "60 شدة ببجي", price: 5000, stock: 262, tag: "نادرة", isRare: true, img: "1000121462.jpg", desc: "اشحن 60 شدة في حسابك" },
            { id: 4, name: "بطاقة تغيير الاسم", price: 6000, stock: 99, tag: "عادية", isRare: false, img: "1000121462.jpg", desc: "غير اسمك داخل اللعبة" },
            { id: 5, name: "رويال باس ببجي", price: 7500, stock: 99, tag: "عادية", isRare: false, img: "1000121463.jpg", desc: "شحن الرويال باس ببجي" }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            trackVisitors();
            handleReferral();
            updatePointsDisplay();
            renderStore();
            checkDailySpinStatus();
        });

        /* احتساب الزوار الحقيقيين للموقع */
        function trackVisitors() {
            let visitors = parseInt(localStorage.getItem('totalVisitorsCount') || '142');
            let isVisited = sessionStorage.getItem('visited');
            if (!isVisited) {
                visitors += 1;
                localStorage.setItem('totalVisitorsCount', visitors);
                sessionStorage.setItem('visited', 'true');
            }
            document.getElementById('realVisitorsCount').innerText = visitors;
        }

        /* نظام الإحالة (الرابط والدعوة) */
        function handleReferral() {
            let urlParams = new URLSearchParams(window.location.search);
            let refId = urlParams.get('ref');

            let myRefCount = parseInt(localStorage.getItem('myReferralsCount') || '0');
            document.getElementById('referralCount').innerText = myRefCount;

            if (refId && !localStorage.getItem('usedRef')) {
                localStorage.setItem('usedRef', 'true');
                alert('أهلاً بك! دخلت عبر رابط إحالة صديق.');
            }
        }

        function copyReferralLink() {
            let myRefUrl = window.location.origin + window.location.pathname + "?ref=USER_" + Math.floor(1000 + Math.random() * 9000);
            navigator.clipboard.writeText(myRefUrl);
            alert('تم نسخ رابط الإحالة الخاص بك:\n' + myRefUrl + '\n\nأرسله لأصدقائك واكسب 60 نقطة لكل دخول!');
        }

        function updatePointsDisplay() {
            document.getElementById('userPointsHeader').innerText = currentPoints;
            document.getElementById('profilePoints').innerText = currentPoints;
            localStorage.setItem('userPoints', currentPoints);
        }

        /* القفل اليومي 24 ساعة لتدوير العجلة */
        function checkDailySpinStatus() {
            let lastSpin = localStorage.getItem('lastSpinDate');
            let today = new Date().toDateString();
            let spinBtn = document.getElementById('spinBtn');

            if (lastSpin === today) {
                spinBtn.innerText = "تم التدوير اليوم ❌ (عد غداً)";
                spinBtn.disabled = true;
            }
        }

        function spinWheel() {
            let lastSpin = localStorage.getItem('lastSpinDate');
            let today = new Date().toDateString();

            if (lastSpin === today) {
                alert('لقد حصلت على نقطة اليوم بالفعل! حاول مجدداً غداً.');
                return;
            }

            if (isSpinning) return;
            isSpinning = true;

            let randomDegree = Math.floor(1800 + Math.random() * 360);
            let wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${randomDegree}deg)`;

            setTimeout(() => {
                currentPoints += 250;
                updatePointsDisplay();
                localStorage.setItem('lastSpinDate', today);
                
                let spinBtn = document.getElementById('spinBtn');
                spinBtn.innerText = "تم التدوير اليوم ❌ (عد غداً)";
                spinBtn.disabled = true;

                alert('مبروك! حصلت على 250 نقطة 🎉');
                isSpinning = false;
            }, 3000);
        }

        function renderStore() {
            let container = document.getElementById('productsContainer');
            container.innerHTML = '';
            products.forEach(p => {
                let isOut = p.stock === 0;
                container.innerHTML += `
                    <div class="product-card">
                        <div class="product-img-box">
                            <span class="product-tag ${p.isRare ? 'rare' : ''}">${p.tag}</span>
                            <img src="${p.img}" alt="${p.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/150';">
                        </div>
                        <div class="product-details">
                            <div class="product-title">${p.name}</div>
                            <div class="product-desc">${p.desc}</div>
                            <div class="product-meta">
                                <span class="product-points">${p.price} نقطة</span>
                                <span class="product-stock">متبقي ${p.stock}</span>
                            </div>
                            <button class="btn-buy ${isOut ? 'out-of-stock' : ''}" 
                                    onclick="${isOut ? '' : `buyItem('${p.name}', ${p.price})`}"
                                    ${isOut ? 'disabled' : ''}>
                                ${isOut ? 'نفدت الكمية' : 'شراء'}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function buyItem(name, price) {
            if (currentPoints < price) {
                alert('نقاطك غير كافية للشراء!');
                return;
            }
            currentPoints -= price;
            updatePointsDisplay();
            alert(`تم طلب ${name} بنجاح!`);
        }

        function switchPage(pageId, btn) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            if(btn) btn.classList.add('active');
        }
    </script>
</body>
</html>
